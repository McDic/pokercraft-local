# Deploy web app to GitHub Pages
name: Deploy Web to GitHub Pages

on:
  # Run on pushes to master that change web/ or Rust WASM files
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'crates/core/**'
      - 'crates/wasm/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'web/public/hu_preflop_cache.bin'
      - '.github/workflows/deploy-web.yml'
      # The build inputs this workflow runs but does not otherwise watch.
      - '.github/actions/setup-wasm-build/**'
      - 'scripts/build-wasm.sh'
  # Allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust toolchain + Cargo cache + pinned wasm-pack, shared with test-web.yml so that what
      # ships is built by the toolchain the PR gate validated. Rationale lives in the action.
      - name: Setup WASM build toolchain
        uses: ./.github/actions/setup-wasm-build

      - name: Build WASM
        run: ./scripts/build-wasm.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
