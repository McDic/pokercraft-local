# Deploy web app to GitHub Pages
name: Deploy Web to GitHub Pages

on:
  # Run on pushes to master that change web/ or Rust WASM files
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'crates/core/**'
      - 'crates/wasm/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'web/public/hu_preflop_cache.bin'
      - '.github/workflows/deploy-web.yml'
      # The shared toolchain action this workflow calls.
      - '.github/actions/setup-wasm-build/**'
  # Allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust toolchain + Cargo cache + pinned wasm-pack, shared with test-web.yml.
      #
      # This step used to be a hand-rolled copy that had drifted: `cargo install wasm-pack`,
      # unpinned. It compiled from source on every deploy (77s, measured, and not fixable by
      # caching — test-web.yml wins the shared cache key and stores a ~/.cargo/bin with no
      # wasm-pack in it), and being unpinned it would have started building the published
      # artifact with a different wasm-pack than the PR gate validates the moment upstream
      # tagged a release. It resolved to the same v0.15.0 only by coincidence.
      - name: Setup WASM build toolchain
        uses: ./.github/actions/setup-wasm-build

      - name: Build WASM
        run: ./scripts/build-wasm.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
