# The tests themselves are pure TypeScript, but the typecheck step below needs the
# generated WASM bindings in web/src/wasm/ (gitignored) to resolve, so this workflow
# builds the wasm crate and therefore also has to trigger on Rust changes.
name: Web Testing

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
    paths:
      - "web/**"
      - "crates/core/**"
      - "crates/wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test-web.yml"
      # The build inputs this workflow runs but does not otherwise watch. Without these, a
      # change to the wasm-pack pin or to the build script would land untested by the very
      # workflow that validates it.
      - ".github/actions/setup-wasm-build/**"
      - "scripts/build-wasm.sh"
  pull_request:
    branches:
      - "**"
    paths:
      - "web/**"
      - "crates/core/**"
      - "crates/wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test-web.yml"
      # The build inputs this workflow runs but does not otherwise watch. Without these, a
      # change to the wasm-pack pin or to the build script would land untested by the very
      # workflow that validates it.
      - ".github/actions/setup-wasm-build/**"
      - "scripts/build-wasm.sh"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node and lint come before the Rust/WASM build purely for feedback speed: lint needs
      # neither a toolchain nor the generated bindings, so making a one-character lint error
      # wait out a full wasm-pack build before it reports would be wasted minutes on every
      # such PR. Everything from `Setup Rust` down is unchanged and still gates the run.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Lint was previously run only by hand, which let seven errors accumulate on master
      # unnoticed — including three genuine render-purity bugs the react-hooks rules catch
      # and review had not. It lives here rather than in pre-commit.yml because that workflow
      # has no Node toolchain, and this one has just installed the dependencies anyway.
      # `tseslint.configs.recommended` is not type-aware, so this needs no type information
      # of its own and does not have to wait for the bindings.
      - name: Lint
        working-directory: web
        run: npm run lint

      # Rust toolchain + Cargo cache + pinned wasm-pack, shared with deploy-web.yml so that what
      # ships is built by the toolchain this gate validated. Rationale lives in the action.
      - name: Setup WASM build toolchain
        uses: ./.github/actions/setup-wasm-build

      # web/src/wasm/ is generated and gitignored, so tsc cannot resolve the module
      # without this.
      - name: Build WASM
        run: ./scripts/build-wasm.sh

      # Typechecking used to run only in the deploy workflow, on master. That is too
      # late: i18n keys are checked by the type system, so a mistyped key would go
      # green on the PR and only break the deploy.
      - name: Typecheck
        working-directory: web
        run: npx tsc -b

      - name: Run tests
        working-directory: web
        run: npm test
