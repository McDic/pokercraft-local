# A *composite action*: a reusable sequence of steps, called from a workflow with a single
# `uses:`. The mechanics, since they differ from a workflow file in ways that are easy to trip on:
#
#   * It must live at `.github/actions/<name>/action.yml`, and the file must be named
#     `action.yml` (or `action.yaml`). The directory name is what callers reference.
#   * Callers reference it by *path*, not by `owner/repo`: `uses: ./.github/actions/setup-wasm-build`.
#     The path is relative to the repository root, not to the calling workflow.
#   * Because it is a path, `actions/checkout` must have already run in that job — the action's
#     own file is part of the repo, so before checkout there is nothing to call.
#   * `name` and `description` are both required. A missing `description` is a hard error, not a
#     warning.
#   * Every `run:` step inside a composite action must set `shell:` explicitly. Workflows default
#     it; composite actions do not, and omitting it fails at runtime. (Nothing here uses `run:`,
#     but it is the single most common surprise when one is added later.)
#
# Deliberately takes no `inputs`. The point of this action is that both callers get *identical*
# tooling; an input for, say, the wasm-pack version would hand a caller the means to drift, which
# is the exact failure this consolidates away.

name: Setup WASM build toolchain
description: >-
  Installs everything scripts/build-wasm.sh needs — the Rust toolchain with the wasm32 target,
  the shared Cargo cache, and a pinned prebuilt wasm-pack.

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ". -> target"
        shared-key: "wasm-build"

    # Prebuilt binary. `cargo install wasm-pack` compiles it from source and costs
    # minutes on every run, which is too much for a workflow that gates every PR.
    #
    # The version is PINNED, and must stay pinned. `version: 'latest'` asks the action to
    # resolve the newest release from the GitHub API *unauthenticated* — and on a failure
    # or a rate limit it does not error, it silently falls back to a hard-coded default:
    #
    #     return Promise.resolve(JSON.parse(body).tag_name || 'v0.9.1')
    #
    # v0.9.1 is from 2020 and ships a `wasm-opt` that predates the reference-types
    # proposal, so it cannot even parse the module current Rust emits:
    #
    #     [parse exception: Only 1 table definition allowed in MVP]
    #
    # The failure is intermittent by construction — it depends on whether an API call is
    # rate-limited, which is likeliest when two runs fire at once, as `push` and
    # `pull_request` do for every PR. That is exactly how it presented: one commit, both
    # events, one green (v0.15.0) and one red (v0.9.1). A rerun would have "fixed" it and
    # taught us nothing.
    - name: Install wasm-pack
      uses: jetli/wasm-pack-action@v0.4.0
      with:
        version: 'v0.15.0'
