# Shared by test-web.yml and deploy-web.yml, so the toolchain that gates a PR is by construction
# the toolchain that builds what ships. They used to hand-roll these steps separately and the
# copies drifted: deploy ran an unpinned `cargo install wasm-pack`, compiling from source for 76s
# on every deploy and one upstream release away from building the published artifact with a
# different wasm-pack than the gate validates.
#
# Callers must run `actions/checkout` first. This action is referenced by path, and its own file
# is part of the repo — before checkout there is nothing to call.
#
# Deliberately takes no `inputs`. The point is that both callers get *identical* tooling; an input
# for, say, the wasm-pack version would hand a caller the means to drift again, which is the exact
# failure being consolidated away. If a third caller ever needs different settings, widen this for
# everyone rather than adding a parameter.

name: Setup WASM build toolchain
description: >-
  Installs everything scripts/build-wasm.sh needs — the Rust toolchain with the wasm32 target,
  the shared Cargo cache, and a pinned prebuilt wasm-pack.

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ". -> target"
        shared-key: "wasm-build"

    # Prebuilt binary. `cargo install wasm-pack` compiles it from source and costs
    # minutes on every run, which is too much for a workflow that gates every PR.
    # taiki-e/install-action downloads the release tarball and verifies it against the
    # SHA-256 recorded in its own manifest, so the binary is checksum-pinned, not just
    # version-pinned.
    #
    # The version is PINNED, and must stay pinned: an unpinned tool means the artifact we
    # ship can be built by a wasm-pack the PR gate never ran. (The previous action made
    # this worse — its `'latest'` silently fell back to a 2020 v0.9.1 on an API rate
    # limit, whose `wasm-opt` cannot parse the module current Rust emits.)
    #
    # Why not jetli/wasm-pack-action: unmaintained since 2023, and it installed with a
    # bare `fs.rename` from /tmp into ~/.cargo/bin. On runners where /tmp is a separate
    # mount that fails with `EXDEV: cross-device link not permitted` — which is how it
    # broke the deploy of master 7875f2c on ubuntu-26.04 image 20261028, while the test
    # job on the same image and commit happened to pass.
    - name: Install wasm-pack
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack@0.15.0
